# Render Blueprint for MediFind Deployment
# See https://render.com/docs/blueprint-spec for documentation

databases:
  - name: medifind-postgres
    databaseName: medifind
    user: medifind_user
    plan: free
    region: oregon # or frankfurt, singapore

services:
  - type: web
    name: medifind
    env: python
    plan: free
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,http://localhost:8000"
      - key: DATABASE_URL
        fromDatabase:
          name: medifind-postgres
          property: connectionString
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: PYTHON_VERSION
        value: "3.11.9"
