{% extends 'base.html' %}

{% block title %}Password Updated - MediFind{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="med-card p-4 p-md-5 text-center">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 70px; height: 70px; background-color: var(--med-success-bg); color: var(--med-success); font-size: 2rem;">
        <i class="bi bi-shield-check"></i>
      </div>

      <h3 class="fw-bold text-dark mb-2">Password Successfully Changed</h3>
      <p class="text-muted small mb-4">
        Your account password has been safely updated. All active sessions remain secure.
      </p>

      <div class="d-flex flex-column gap-2">
        <a href="{% url 'profile' %}" class="btn btn-med-primary py-2 shadow-sm">
          <i class="bi bi-person me-1"></i> Return to Profile
        </a>
        <a href="{% url 'dashboard' %}" class="btn btn-med-outline py-2">
          Go to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
