{% extends 'base.html' %}

{% block title %}Password Reset Complete - MediFind{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="med-card p-4 p-md-5 text-center">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 70px; height: 70px; background-color: var(--med-success-bg); color: var(--med-success); font-size: 2rem;">
        <i class="bi bi-check2-circle"></i>
      </div>

      <h3 class="fw-bold text-dark mb-2">Password Successfully Reset</h3>
      <p class="text-secondary small mb-4">
        Your new password has been established and encrypted. You can now authenticate with your updated credentials.
      </p>

      <a href="{% url 'login' %}" class="btn btn-med-primary w-100 py-2 shadow-sm">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to MediFind
      </a>
    </div>
  </div>
</div>
{% endblock %}
